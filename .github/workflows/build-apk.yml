
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: |
          flutter create --platforms=android --org ir.aryan.taskplanner .
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          grep compileSdk android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get
        
      - name: Fix file_picker Android SDK
        run: |
          find "$HOME/.pub-cache" -type f \( -path '*/file_picker-*/android/build.gradle' -o -path '*/file_picker-*/android/build.gradle.kts' \) -print -exec sed -i \
            -e 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' \
            -e 's/compileSdkVersion 34/compileSdkVersion 36/g' \
            -e 's/compileSdk flutter.compileSdkVersion/compileSdk 36/g' \
            -e 's/compileSdk 34/compileSdk 36/g' \
            -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
            -e 's/compileSdk = 34/compileSdk = 36/g' {} \;
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task-planner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
