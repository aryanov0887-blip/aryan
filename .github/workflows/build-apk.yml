name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: |
          flutter create --platforms=android --org ir.aryan.taskplanner .
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          grep compileSdk android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Fix file_picker Android SDK
        run: |
          find "$HOME/.pub-cache" -type f \( -path '*/file_picker-*/android/build.gradle' -o -path '*/file_picker-*/android/build.gradle.kts' \) -print -exec sed -i \
            -e 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' \
            -e 's/compileSdkVersion 34/compileSdkVersion 36/g' \
            -e 's/compileSdk flutter.compileSdkVersion/compileSdk 36/g' \
            -e 's/compileSdk 34/compileSdk 36/g' \
            -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
            -e 's/compileSdk = 34/compileSdk = 36/g' {} \;

      - name: Configure Android notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()

          if "isCoreLibraryDesugaringEnabled" not in text:
              text, count = re.subn(
                  r"(compileOptions\s*\{)",
                  r"\1\n        isCoreLibraryDesugaringEnabled = true",
                  text,
                  count=1
              )
              assert count == 1, "compileOptions block not found"

          if "desugar_jdk_libs" not in text:
              dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
              match = re.search(r"dependencies\s*\{", text)

              if match:
                  text = text[:match.end()] + "\n" + dependency + text[match.end():]
              else:
                  text += "\n\ndependencies {\n" + dependency + "}\n"

          gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          if "android.permission.RECEIVE_BOOT_COMPLETED" not in text:
              text, count = re.subn(
                  r"(<manifest\b[^>]*>)",
                  r'\1\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>',
                  text,
                  count=1
              )
              assert count == 1, "manifest tag not found"

          if "ScheduledNotificationReceiver" not in text:
              receivers = """
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
              """
              text, count = re.subn(
                  r"(<application\b[^>]*>)",
                  lambda m: m.group(1) + receivers,
                  text,
                  count=1
              )
              assert count == 1, "application tag not found"

          manifest.write_text(text)
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task-planner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
