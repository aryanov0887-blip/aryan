name: task_planner
description: A Persian Jalali task planner.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shamsi_date: ^1.1.1
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.1
